databaseChangeLog:
  - changeSet:
      id: 2026-01-05--0001-book
      author: hw6
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_books
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_books_authors
            baseTableName: books
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 2026-01-05--0002-books-genres
      author: hw6
      changes:
        - createTable:
            tableName: books_genres
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: books_genres
            columnNames: book_id, genre_id
            constraintName: pk_books_genres

        - addForeignKeyConstraint:
            constraintName: fk_books_genres_books
            baseTableName: books_genres
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            constraintName: fk_books_genres_genres
            baseTableName: books_genres
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
            constraintName: fk_books_genres



