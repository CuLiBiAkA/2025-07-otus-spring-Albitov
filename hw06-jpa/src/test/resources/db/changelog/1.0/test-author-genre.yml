databaseChangeLog:
  - changeSet:
      id: 2026-01-05--0001-author
      author: hw6
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_authors
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2026-01-05--0001-genre
      author: hw6
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_genres
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false